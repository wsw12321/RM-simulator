# Download-and-run packages with prebuilt native binaries.
#  - push a tag v*            -> build, smoke-test and publish a GitHub Release
#  - "Run workflow" (manual)  -> build and smoke-test; packages are run artifacts
#  - push touching packaging  -> same check, so packaging breakage shows up early
name: Release packages

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:  # not evaluated for tag pushes
      - tools/package_release.py
      - tools/native_build.py
      - tools/release/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            cxx: g++
          - os: macos-latest  # pinned macOS images get retired (macos-14 is no longer offered)
            platform: macos-universal
            cxx: clang++ -arch arm64 -arch x86_64
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.cxx }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # the documented minimum; the smoke test runs the package with it
      - name: Build, package and smoke-test
        run: python tools/package_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "RMUC Tactics Lab $GITHUB_REF_NAME" --generate-notes
